<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Spatial Sound Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video {
      position: absolute;

      width: 320px;
      height: 240px;

      right: 20px;
      bottom: 20px;

      object-fit: cover;

      opacity: 0.28;

      transform: scaleX(-1);

      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #info {
      position: absolute;

      top: 30px;
      left: 30px;

      z-index: 20;

      line-height: 1.6;
    }

    #state {
      font-size: 38px;
      font-weight: bold;

      margin-bottom: 10px;
    }

    .data {
      opacity: 0.55;
    }

    #mainVisual {
      width: 250px;
      height: 250px;

      border-radius: 50%;

      background: white;

      opacity: 0.2;

      transition:
        transform 0.15s linear,
        opacity 0.15s linear;
    }

    #startButton {
      position: absolute;

      z-index: 100;

      padding: 18px 30px;

      border: none;
      border-radius: 100px;

      background: white;
      color: black;

      font-size: 18px;

      cursor: pointer;
    }

    #startButton:hover {
      transform: scale(1.04);
    }
  </style>
</head>

<body>

<div id="app">

  <button id="startButton">
    START
  </button>

  <div id="info">

    <div id="state">
      WAITING
    </div>

    <div id="depthText" class="data">
      Depth: 0
    </div>

    <div id="xText" class="data">
      Horizontal: 0
    </div>

    <div id="centerText" class="data">
      Distance from centre: 0
    </div>

    <div id="pitchText" class="data">
      Pitch: 1.00x
    </div>

    <div id="intensityText" class="data">
      Intensity: 0
    </div>

  </div>

  <div id="mainVisual"></div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

//
// ======================================================
// ELEMENTS
// ======================================================
//

const video =
  document.getElementById("video");

const startButton =
  document.getElementById("startButton");

const stateText =
  document.getElementById("state");

const depthText =
  document.getElementById("depthText");

const xText =
  document.getElementById("xText");

const centerText =
  document.getElementById("centerText");

const pitchText =
  document.getElementById("pitchText");

const intensityText =
  document.getElementById("intensityText");

const visual =
  document.getElementById("mainVisual");


//
// ======================================================
// AUDIO FILES
// ======================================================
//
// folder:
//
// project/
// ├── index.html
// └── sounds/
//     ├── left.wav
//     ├── center.wav
//     └── right.wav
//

const audio = {

  left:
    new Audio("sounds/left.wav"),

  center:
    new Audio("sounds/center.wav"),

  right:
    new Audio("sounds/right.wav")

};


Object.values(audio).forEach(sound => {

  sound.loop = true;

  sound.volume = 1;

  // pitch follows playback rate
  sound.preservesPitch = false;

});


//
// ======================================================
// WEB AUDIO NODES
// ======================================================
//

let audioContext;

let leftSource;
let centerSource;
let rightSource;

let leftGain;
let centerGain;
let rightGain;

let leftPan;
let centerPan;
let rightPan;

let masterGain;

let delayNode;
let delayFeedback;
let delayWet;

let compressor;


// coded ambience

let ambienceGain;
let ambienceFilter;

let ambienceOsc1;
let ambienceOsc2;

let ambienceLFO;
let ambienceLFOGain;


//
// ======================================================
// TRACKING
// ======================================================
//

let smoothX = 0.5;
let smoothDepth = 0.15;

const smoothing = 0.09;

let bodyPresent = false;
let lastBodySeen = 0;

const noBodyDelay = 1200;


//
// ======================================================
// HELPERS
// ======================================================
//

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


function mapValue(
  value,
  inMin,
  inMax,
  outMin,
  outMax
) {

  return (
    outMin +
    (
      (value - inMin)
      /
      (inMax - inMin)
    )
    *
    (outMax - outMin)
  );

}


//
// ======================================================
// SAFE SMOOTH GAIN
// ======================================================
//

function smoothGain(
  node,
  target,
  time = 0.15
) {

  if (!audioContext || !node) return;

  const now =
    audioContext.currentTime;

  node.gain.cancelScheduledValues(now);

  node.gain.setTargetAtTime(
    target,
    now,
    time
  );

}


//
// ======================================================
// IDLE STATE
// ======================================================
//
// no participant:
//
// center.wav stays present
// subtle ambience underneath
// left and right disappear
//

function returnToIdle() {

  if (!audioContext) return;

  stateText.innerText =
    "CENTER / IDLE";


  smoothGain(
    leftGain,
    0,
    0.9
  );


  smoothGain(
    rightGain,
    0,
    0.9
  );


  smoothGain(
    centerGain,
    0.78,
    0.9
  );


  // original pitch

  audio.left.playbackRate = 1;
  audio.center.playbackRate = 1;
  audio.right.playbackRate = 1;


  // subtle spatial tail

  delayWet.gain.setTargetAtTime(
    0.06,
    audioContext.currentTime,
    0.8
  );


  delayFeedback.gain.setTargetAtTime(
    0.11,
    audioContext.currentTime,
    0.8
  );


  // ambience still exists,
  // but doesn't dominate

  ambienceGain.gain.setTargetAtTime(
    0.038,
    audioContext.currentTime,
    1
  );


  pitchText.innerText =
    "Pitch: 1.000x";


  intensityText.innerText =
    "Intensity: idle";

}


//
// ======================================================
// ACTIVE AUDIO
// ======================================================
//

function updateAudio(
  bodyX,
  depth
) {

  if (!audioContext) return;


  //
  // ----------------------------------
  // DEPTH NORMALISATION
  // ----------------------------------
  //
  // small shoulder width = far
  // large shoulder width = close
  //

  const depthAmount =
    clamp(

      mapValue(
        depth,
        0.12,
        0.50,
        0,
        1
      ),

      0,
      1

    );


  //
  // ----------------------------------
  // HORIZONTAL DISTANCE FROM CENTER
  // ----------------------------------
  //

  const edgeDistance =
    clamp(

      Math.abs(
        bodyX - 0.5
      )
      /
      0.5,

      0,
      1

    );


  //
  // ----------------------------------
  // LEFT / CENTER / RIGHT CROSSFADE
  // ----------------------------------
  //

  let leftWeight = 0;
  let centerWeight = 0;
  let rightWeight = 0;


  if (bodyX <= 0.5) {

    const amount =
      bodyX / 0.5;

    leftWeight =
      1 - amount;

    centerWeight =
      amount;

  }

  else {

    const amount =
      (bodyX - 0.5)
      /
      0.5;

    centerWeight =
      1 - amount;

    rightWeight =
      amount;

  }


  //
  // center never fully disappears
  //

  centerWeight =
    Math.max(
      centerWeight,
      0.34
    );


  //
  // ----------------------------------
  // INTENSITY
  // ----------------------------------
  //
  // far is already loud
  // close becomes overwhelming
  //

  const intensity =
    mapValue(
      depthAmount,
      0,
      1,
      0.78,
      1.18
    );


  //
  // additional intensity toward edges
  //

  const spatialBoost =
    1 +
    edgeDistance * 0.12;


  const finalIntensity =
    intensity *
    spatialBoost;


  //
  // ----------------------------------
  // APPLY TRACK LEVELS
  // ----------------------------------
  //

  smoothGain(
    leftGain,
    clamp(
      leftWeight *
      finalIntensity,
      0,
      1.2
    ),
    0.14
  );


  smoothGain(
    centerGain,
    clamp(
      centerWeight *
      finalIntensity,
      0,
      1.2
    ),
    0.14
  );


  smoothGain(
    rightGain,
    clamp(
      rightWeight *
      finalIntensity,
      0,
      1.2
    ),
    0.14
  );


  //
  // ----------------------------------
  // PITCH
  // ----------------------------------
  //
  // still subtle enough to keep
  // the WAV quality intact
  //

  let playbackRate =

    0.99 +

    depthAmount *
    0.075 +

    edgeDistance *
    0.03;


  playbackRate =
    clamp(
      playbackRate,
      0.99,
      1.095
    );


  audio.left.playbackRate =
    playbackRate;

  audio.center.playbackRate =
    playbackRate;

  audio.right.playbackRate =
    playbackRate;


  //
  // ----------------------------------
  // DELAY / SPACE
  // ----------------------------------
  //

  const wetAmount =
    0.07 +

    depthAmount *
    0.13 +

    edgeDistance *
    0.05;


  delayWet.gain.setTargetAtTime(

    clamp(
      wetAmount,
      0.07,
      0.25
    ),

    audioContext.currentTime,

    0.18

  );


  //
  // delay feedback increases
  // when approaching
  //

  const feedbackAmount =
    0.13 +

    depthAmount *
    0.17 +

    edgeDistance *
    0.04;


  delayFeedback.gain.setTargetAtTime(

    clamp(
      feedbackAmount,
      0.13,
      0.34
    ),

    audioContext.currentTime,

    0.2

  );


  //
  // ----------------------------------
  // AMBIENCE INTENSITY
  // ----------------------------------
  //

  const ambienceAmount =
    0.04 +

    depthAmount *
    0.04 +

    edgeDistance *
    0.012;


  ambienceGain.gain.setTargetAtTime(

    clamp(
      ambienceAmount,
      0.04,
      0.09
    ),

    audioContext.currentTime,

    0.4

  );


  //
  // ----------------------------------
  // DISPLAY
  // ----------------------------------
  //

  pitchText.innerText =
    "Pitch: " +
    playbackRate.toFixed(3) +
    "x";


  intensityText.innerText =
    "Intensity: " +
    finalIntensity.toFixed(2);

}


//
// ======================================================
// MEDIAPIPE
// ======================================================
//

const pose =
  new Pose({

    locateFile: file => {

      return (
        "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"
        +
        file
      );

    }

  });


pose.setOptions({

  modelComplexity: 1,

  smoothLandmarks: true,

  enableSegmentation: false,

  minDetectionConfidence: 0.55,

  minTrackingConfidence: 0.55

});


pose.onResults(
  onPoseResults
);


//
// ======================================================
// POSE RESULTS
// ======================================================
//

function onPoseResults(results) {

  const now =
    performance.now();


  //
  // ----------------------------------
  // NO BODY
  // ----------------------------------
  //

  if (!results.poseLandmarks) {

    if (
      bodyPresent &&
      now - lastBodySeen >
      noBodyDelay
    ) {

      bodyPresent = false;

      returnToIdle();

    }

    return;

  }


  //
  // ----------------------------------
  // BODY FOUND
  // ----------------------------------
  //

  bodyPresent = true;

  lastBodySeen = now;


  const leftShoulder =
    results.poseLandmarks[11];

  const rightShoulder =
    results.poseLandmarks[12];


  //
  // make sure shoulders are
  // tracked confidently
  //

  if (
    leftShoulder.visibility < 0.4 ||
    rightShoulder.visibility < 0.4
  ) {

    return;

  }


  //
  // ----------------------------------
  // DEPTH
  // ----------------------------------
  //

  const dx =
    leftShoulder.x -
    rightShoulder.x;

  const dy =
    leftShoulder.y -
    rightShoulder.y;


  const rawDepth =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  //
  // ----------------------------------
  // BODY X POSITION
  // ----------------------------------
  //

  let rawX =

    (
      leftShoulder.x +
      rightShoulder.x
    )

    / 2;


  //
  // mirror X
  // because video is mirrored
  //

  rawX =
    1 - rawX;


  //
  // ----------------------------------
  // SMOOTHING
  // ----------------------------------
  //

  smoothX +=
    (
      rawX -
      smoothX
    )
    *
    smoothing;


  smoothDepth +=
    (
      rawDepth -
      smoothDepth
    )
    *
    smoothing;


  //
  // ----------------------------------
  // AUDIO
  // ----------------------------------
  //

  updateAudio(
    smoothX,
    smoothDepth
  );


  //
  // ----------------------------------
  // POSITION LABEL
  // ----------------------------------
  //

  let horizontalState;


  if (
    smoothX < 0.35
  ) {

    horizontalState =
      "LEFT";

  }

  else if (
    smoothX > 0.65
  ) {

    horizontalState =
      "RIGHT";

  }

  else {

    horizontalState =
      "CENTER";

  }


  //
  // ----------------------------------
  // DEPTH LABEL
  // ----------------------------------
  //

  let depthState;


  if (
    smoothDepth < 0.20
  ) {

    depthState =
      "FAR";

  }

  else if (
    smoothDepth < 0.30
  ) {

    depthState =
      "MEDIUM";

  }

  else if (
    smoothDepth < 0.42
  ) {

    depthState =
      "CLOSE";

  }

  else {

    depthState =
      "VERY CLOSE";

  }


  stateText.innerText =
    horizontalState +
    " / " +
    depthState;


  depthText.innerText =
    "Depth: " +
    smoothDepth.toFixed(3);


  xText.innerText =
    "Horizontal: " +
    smoothX.toFixed(3);


  const distanceFromCenter =

    clamp(

      Math.abs(
        smoothX - 0.5
      )
      /
      0.5,

      0,
      1

    );


  centerText.innerText =
    "Distance from centre: " +
    distanceFromCenter.toFixed(3);


  //
  // ----------------------------------
  // TEST VISUAL
  // ----------------------------------
  //

  const scale =
    clamp(

      mapValue(
        smoothDepth,
        0.1,
        0.5,
        0.45,
        2.1
      ),

      0.45,
      2.1

    );


  visual.style.transform =
    `scale(${scale})`;


  visual.style.opacity =
    clamp(

      mapValue(
        smoothDepth,
        0.1,
        0.5,
        0.2,
        1
      ),

      0.2,
      1

    );

}


//
// ======================================================
// START BUTTON
// ======================================================
//

startButton.addEventListener(
  "click",
  async () => {

    startButton.style.display =
      "none";


    //
    // ----------------------------------
    // AUDIO CONTEXT
    // ----------------------------------
    //

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    //
    // ----------------------------------
    // AUDIO SOURCES
    // ----------------------------------
    //

    leftSource =
      audioContext.createMediaElementSource(
        audio.left
      );


    centerSource =
      audioContext.createMediaElementSource(
        audio.center
      );


    rightSource =
      audioContext.createMediaElementSource(
        audio.right
      );


    //
    // ----------------------------------
    // TRACK GAINS
    // ----------------------------------
    //

    leftGain =
      audioContext.createGain();

    centerGain =
      audioContext.createGain();

    rightGain =
      audioContext.createGain();


    leftGain.gain.value = 0;

    centerGain.gain.value = 0.78;

    rightGain.gain.value = 0;


    //
    // ----------------------------------
    // PANNING
    // ----------------------------------
    //

    leftPan =
      audioContext.createStereoPanner();

    centerPan =
      audioContext.createStereoPanner();

    rightPan =
      audioContext.createStereoPanner();


    leftPan.pan.value =
      -0.88;


    centerPan.pan.value =
      0;


    rightPan.pan.value =
      0.88;


    //
    // ----------------------------------
    // DELAY
    // ----------------------------------
    //

    delayNode =
      audioContext.createDelay(1);


    delayNode.delayTime.value =
      0.24;


    delayFeedback =
      audioContext.createGain();


    delayFeedback.gain.value =
      0.11;


    delayWet =
      audioContext.createGain();


    delayWet.gain.value =
      0.06;


    //
    // ----------------------------------
    // MASTER
    // ----------------------------------
    //

    masterGain =
      audioContext.createGain();


    masterGain.gain.value =
      1.12;


    //
    // ----------------------------------
    // COMPRESSOR
    // ----------------------------------
    //
    // important because the sounds
    // are intentionally loud.
    //
    // keeps it dense without
    // completely destroying the output
    //

    compressor =
      audioContext.createDynamicsCompressor();


    compressor.threshold.value =
      -12;


    compressor.knee.value =
      18;


    compressor.ratio.value =
      5;


    compressor.attack.value =
      0.005;


    compressor.release.value =
      0.25;


    //
    // ----------------------------------
    // CONNECT DRY AUDIO
    // ----------------------------------
    //

    leftSource
      .connect(leftGain);

    leftGain
      .connect(leftPan);

    leftPan
      .connect(masterGain);


    centerSource
      .connect(centerGain);

    centerGain
      .connect(centerPan);

    centerPan
      .connect(masterGain);


    rightSource
      .connect(rightGain);

    rightGain
      .connect(rightPan);

    rightPan
      .connect(masterGain);


    //
    // ----------------------------------
    // DELAY SEND
    // ----------------------------------
    //

    leftPan.connect(
      delayNode
    );

    centerPan.connect(
      delayNode
    );

    rightPan.connect(
      delayNode
    );


    delayNode.connect(
      delayFeedback
    );


    delayFeedback.connect(
      delayNode
    );


    delayNode.connect(
      delayWet
    );


    delayWet.connect(
      masterGain
    );


    //
    // ==================================================
    // CODED AMBIENCE
    // ==================================================
    //

    ambienceGain =
      audioContext.createGain();


    ambienceGain.gain.value =
      0.038;


    ambienceFilter =
      audioContext.createBiquadFilter();


    ambienceFilter.type =
      "lowpass";


    ambienceFilter.frequency.value =
      380;


    ambienceFilter.Q.value =
      0.8;


    //
    // TWO LOW OSCILLATORS
    //

    ambienceOsc1 =
      audioContext.createOscillator();


    ambienceOsc2 =
      audioContext.createOscillator();


    ambienceOsc1.type =
      "sine";


    ambienceOsc2.type =
      "sine";


    ambienceOsc1.frequency.value =
      55;


    ambienceOsc2.frequency.value =
      82.5;


    //
    // tiny detune creates width / tension
    //

    ambienceOsc2.detune.value =
      5;


    ambienceOsc1
      .connect(ambienceFilter);


    ambienceOsc2
      .connect(ambienceFilter);


    ambienceFilter
      .connect(ambienceGain);


    ambienceGain
      .connect(masterGain);


    //
    // ----------------------------------
    // AMBIENT BREATH
    // ----------------------------------
    //

    ambienceLFO =
      audioContext.createOscillator();


    ambienceLFOGain =
      audioContext.createGain();


    ambienceLFO.frequency.value =
      0.065;


    ambienceLFOGain.gain.value =
      0.006;


    ambienceLFO
      .connect(
        ambienceLFOGain
      );


    ambienceLFOGain
      .connect(
        ambienceGain.gain
      );


    //
    // ----------------------------------
    // MASTER OUTPUT
    // ----------------------------------
    //

    masterGain.connect(
      compressor
    );


    compressor.connect(
      audioContext.destination
    );


    //
    // ----------------------------------
    // START AMBIENCE
    // ----------------------------------
    //

    ambienceOsc1.start();

    ambienceOsc2.start();

    ambienceLFO.start();


    //
    // ----------------------------------
    // START ALL WAV FILES
    // ----------------------------------
    //
    // all start at the same time,
    // so crossfading remains synchronised
    //

    try {

      await Promise.all([

        audio.left.play(),

        audio.center.play(),

        audio.right.play()

      ]);

    }

    catch(error) {

      console.error(
        "Audio start error:",
        error
      );

    }


    //
    // ----------------------------------
    // IDLE
    // ----------------------------------
    //

    returnToIdle();


    //
    // ----------------------------------
    // CAMERA
    // ----------------------------------
    //

    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await pose.send({
                image: video
              });

            },

          width: 1280,

          height: 720

        }
      );


    try {

      await camera.start();

    }

    catch(error) {

      console.error(
        "Camera error:",
        error
      );


      stateText.innerText =
        "CAMERA ERROR";

    }

  }
);

</script>

</body>
</html>
